name: Unpack Aetheris Studio

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/aetheris
          unzip -o AetherisStudio-starter.zip -d /tmp/aetheris
          cp -R /tmp/aetheris/AetherisStudio/. .
          rm -rf /tmp/aetheris
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add Aetheris Studio source files"
            git push
          fi
